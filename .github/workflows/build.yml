name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize Swift Package
      run: |
        mkdir -p Sources/Speedometer
        mv SpeedometerApp.swift Sources/Speedometer/
        mv ContentView.swift Sources/Speedometer/
        
        cat << 'EOF' > Package.swift
        // swift-tools-version:5.5
        import PackageDescription

        let package = Package(
            name: "Speedometer",
            platforms: [.iOS(.v14)],
            products: [
                .executable(name: "Speedometer", targets: ["Speedometer"])
            ],
            targets: [
                .executableTarget(
                    name: "Speedometer",
                    path: "Sources/Speedometer"
                )
            ]
        )
        EOF

    - name: Build Executable
      run: |
        swift build -c release --triple arm64-apple-ios14.0-simulator

    - name: Package IPA Structure
      run: |
        mkdir -p Payload/Speedometer.app
        cp .build/arm64-apple-ios14.0-simulator/release/Speedometer Payload/Speedometer.app/Speedometer
        cp Info.plist Payload/Speedometer.app/Info.plist
        
        echo "APPL????" > Payload/Speedometer.app/PkgInfo
        
        zip -r Speedometer.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Speedometer-IPA
        path: Speedometer.ipa
