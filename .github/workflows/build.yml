name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode project
      run: |
        mkdir -p Speedometer.xcodeproj
        cat << 'EOF' > Speedometer.xcodeproj/project.pbxproj
        // !$*UTF8*$!
        {
          archiveVersion = 1;
          classes = {};
          objectVersion = 54;
          objects = {
            1D6058900D05DD1D006C749F /* Speedometer */ = {isa = PBXAggregateTarget; name = Speedometer; productName = Speedometer;};
          };
          rootObject = 1D6058900D05DD1D006C749F;
        }
        EOF

    - name: Build App with swiftc
      run: |
        mkdir -p Payload/Speedometer.app
        swiftc -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
               -target arm64-apple-ios14.0 \
               -emit-executable \
               -o Payload/Speedometer.app/Speedometer \
               SpeedometerApp.swift ContentView.swift
        
        cp Info.plist Payload/Speedometer.app/Info.plist

    - name: Create IPA Package
      run: |
        zip -r Speedometer.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Speedometer-IPA
        path: Speedometer.ipa
