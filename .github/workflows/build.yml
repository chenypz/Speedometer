name: Build iOS IPA

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build App Executable & Structure
        run: |
          mkdir -p Payload/Speedometer.app

          swiftc \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -target arm64-apple-ios14.0 \
            -emit-executable \
            -o Payload/Speedometer.app/Speedometer \
            SpeedometerApp.swift \
            ContentView.swift \
            SpeedCameraServices.swift

          cp Info.plist Payload/Speedometer.app/Info.plist
          cp speed_cameras.csv Payload/Speedometer.app/speed_cameras.csv

          plutil -convert xml1 Payload/Speedometer.app/Info.plist
          echo -n "APPL????" > Payload/Speedometer.app/PkgInfo

      - name: Package IPA
        run: |
          zip -r Speedometer.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Speedometer-IPA
          path: Speedometer.ipa
