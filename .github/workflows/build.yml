name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install xcodeproj gem
      run: gem install xcodeproj

    - name: Generate Valid Xcode Project
      run: |
        ruby -e '
        require "xcodeproj"
        project = Xcodeproj::Project.new("Speedometer.xcodeproj")
        target = project.new_target(:application, "Speedometer", :ios, "14.0")
        
        # 設定源程式碼檔案
        file1 = project.main_group.new_file("SpeedometerApp.swift")
        file2 = project.main_group.new_file("ContentView.swift")
        target.add_file_references([file1, file2])
        
        # 設定 Build Settings
        target.build_configurations.each do |config|
          config.build_settings["INFOPLIST_FILE"] = "Info.plist"
          config.build_settings["PRODUCT_BUNDLE_IDENTIFIER"] = "com.chenypz.speedometer"
          config.build_settings["IPHONEOS_DEPLOYMENT_TARGET"] = "14.0"
          config.build_settings["SWIFT_VERSION"] = "5.0"
          config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
          config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
        end
        
        project.save
        '

    - name: Build with xcodebuild
      run: |
        xcodebuild -project Speedometer.xcodeproj \
                   -scheme Speedometer \
                   -configuration Release \
                   -sdk iphoneos \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   BUILD_DIR=build

    - name: Package IPA Structure
      run: |
        mkdir -p Payload
        cp -R build/Release-iphoneos/Speedometer.app Payload/
        zip -r Speedometer.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Speedometer-IPA
        path: Speedometer.ipa
