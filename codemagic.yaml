workflows:
  ios-build:
    name: iOS Build
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      ios_signing:
        distribution_type: development
        bundle_identifier: com.chenypz.speedometer
    scripts:
      - name: Build iOS app
        script: |
          xcodebuild \
            -project Speedometer.xcodeproj \
            -scheme Speedometer \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
